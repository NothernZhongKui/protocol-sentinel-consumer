name: Sentinel Authority Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  authority-gate:
    name: Sentinel Authority Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: checkout/protocol-sentinel-consumer
          submodules: recursive
          persist-credentials: false

      - name: Checkout trusted base revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false

      - name: Enforce trusted tool revision
        shell: bash
        env:
          EXPECTED_SENTINEL_SHA: 944ff25f356f2b5c537076c43d4ce8b0edb181b0
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/checkout/protocol-sentinel-consumer"
          installed="$project/lib/protocol-sentinel"

          recorded="$(
            git -C "$project" ls-tree HEAD lib/protocol-sentinel |
            awk '{print $3}'
          )"

          test "$recorded" = "$EXPECTED_SENTINEL_SHA"
          test "$(git -C "$installed" rev-parse HEAD)" = "$EXPECTED_SENTINEL_SHA"

          test -f "$GITHUB_WORKSPACE/trusted-base/.github/sentinel/trusted-policy.toml"
          test -f "$project/sentinel-safe.toml"

          echo "PASS | Pinned trusted Sentinel revision"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      - name: Install verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          base="$GITHUB_WORKSPACE/checkout/protocol-sentinel-consumer/lib/protocol-sentinel"
          python -m pip install \
            -r "$base/evidence/requirements-schema.txt" \
            -r "$base/evidence/requirements-abi.txt"
          python -m pip check

      - name: Execute and evaluate authority regression
        shell: bash
        run: |
          set -euo pipefail

          project="$GITHUB_WORKSPACE/checkout/protocol-sentinel-consumer"
          policy="$GITHUB_WORKSPACE/trusted-base/.github/sentinel/trusted-policy.toml"
          runner="$project/lib/protocol-sentinel/scripts/run_portable_direct.py"

          tested_sha="$(git -C "$project" rev-parse HEAD)"

          GITHUB_SHA="$tested_sha" \
            python -B "$runner" \
              --project "$project" \
              --config sentinel-safe.toml \
              --trusted-policy "$policy" 2>&1 | tee "$RUNNER_TEMP/sentinel-run.log"

      - name: Summarize Sentinel decision
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/checkout/protocol-sentinel-consumer/artifacts/sentinel/runs/completed" "$GITHUB_STEP_SUMMARY" <<'SUMMARY_PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          summary = Path(sys.argv[2])

          runs = sorted(
              p for p in root.iterdir() if p.is_dir()
          ) if root.is_dir() else []

          lines = [
              "## Protocol Sentinel — Authority Gate",
              "",
          ]

          if len(runs) == 1:
              folder = runs[0]

              def read(name):
                  return json.loads(
                      (folder / name).read_text(encoding="utf-8")
                  )

              verification = read("verification.json")
              gate = read("ci-gate.json")

              assert verification["publication"] == "COMPLETED"
              assert verification["classification_replay"] == "MATCH"
              assert verification["schema"] == "VALID"
              assert gate["verification"] == "FRESH_VERIFIED_DIRECT_EVIDENCE"
              assert gate["decision"] in ("PASS", "BLOCK", "REVIEW")
              assert len(gate["scenarios"]) == 1

              scenario = gate["scenarios"][0]
              assert scenario["verdict"] == verification["comparison"]

              lines.extend([
                  "| Scenario | Before | After | Verdict | Decision |",
                  "| --- | --- | --- | --- | --- |",
                  "| `{}` | `{}` | `{}` | `{}` | **{}** |".format(
                      scenario["id"],
                      verification["before"]["status"],
                      verification["after"]["status"],
                      verification["comparison"],
                      gate["decision"],
                  ),
                  "",
                  "**Reason:** `{}`".format(scenario["reason"]),
                  "",
                  "**Classification replay:** `MATCH`",
                  "",
                  "**Compiler replay:** `{}`".format(
                      verification["build_replay"]
                  ),
                  "",
                  "**Evidence:** available in this job's artifact.",
              ])
          else:
              lines.extend([
                  "**Result: technical failure or incomplete execution.**",
                  "",
                  "No uniquely completed verified Evidence was found.",
                  "See the execution log and uploaded diagnostic artifact.",
              ])

          with summary.open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")

          print("PASS | Job Summary written")
          SUMMARY_PY

      - name: Upload Sentinel Evidence and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            checkout/protocol-sentinel-consumer/artifacts/sentinel/runs/completed/
            ${{ runner.temp }}/sentinel-run.log
          if-no-files-found: warn
          retention-days: 7
